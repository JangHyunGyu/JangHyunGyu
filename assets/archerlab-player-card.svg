<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ArcherLab player card</title>
  <desc id="desc">A dark pixel game interface introducing Jang Hyun Gyu as a solo game developer.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.55" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#130b24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20e3ff"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f15cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7dd3fc" stroke-opacity="0.055"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="8" y="8" width="1184" height="404" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="8" y="8" width="1184" height="404" rx="22" fill="url(#bg)"/>
    <rect x="8" y="8" width="1184" height="404" fill="url(#grid)"/>
    <circle cx="1006" cy="210" r="250" fill="url(#glow)"/>

    <g fill="#c4b5fd" opacity="0.6">
      <rect x="86" y="70" width="4" height="4"/>
      <rect x="166" y="105" width="3" height="3"/>
      <rect x="246" y="54" width="5" height="5"/>
      <rect x="373" y="92" width="3" height="3"/>
      <rect x="534" y="62" width="4" height="4"/>
      <rect x="686" y="112" width="3" height="3"/>
      <rect x="786" y="54" width="4" height="4"/>
      <rect x="1112" y="80" width="5" height="5"/>
      <rect x="1094" y="342" width="3" height="3"/>
      <rect x="742" y="359" width="4" height="4"/>
      <rect x="418" y="338" width="3" height="3"/>
      <rect x="166" y="354" width="5" height="5"/>
    </g>

    <g stroke="#22d3ee" fill="none" opacity="0.72">
      <circle cx="1008" cy="210" r="110" stroke-width="2" stroke-dasharray="7 9"/>
      <circle cx="1008" cy="210" r="72" stroke-width="2"/>
      <circle cx="1008" cy="210" r="30" stroke-width="3" filter="url(#softGlow)"/>
      <path d="M1008 74v272M872 210h272" stroke-width="1" stroke-dasharray="3 8"/>
      <path d="m988 210 14 14 28-34" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/>
    </g>

    <g filter="url(#softGlow)">
      <path d="M795 210h208" stroke="#a78bfa" stroke-width="4"/>
      <path d="m1003 210-22-12v24z" fill="#20e3ff"/>
      <path d="m795 210 20-13v26z" fill="#f15cff"/>
    </g>

    <g transform="translate(72 88)">
      <rect width="72" height="72" rx="14" fill="#080b14" stroke="#8b5cf6" stroke-width="2"/>
      <path d="M13 58 32 12h8l19 46H48L36 25l-6 15h12l4 10H26l-3 8z" fill="url(#accent)"/>
      <path d="M5 32h48v-7l16 11-16 11v-7H5z" fill="#20e3ff" opacity="0.9"/>
    </g>

    <g font-family="Consolas, Menlo, Monaco, monospace">
      <text x="72" y="202" fill="#64748b" font-size="15" letter-spacing="4">PLAYER ONE // ARCHERLAB</text>
      <text x="68" y="270" fill="#f8fafc" font-size="62" font-weight="800" letter-spacing="3">JANG HYUN GYU</text>
      <rect x="72" y="296" width="492" height="2" fill="url(#accent)"/>
      <text x="72" y="334" fill="#c4b5fd" font-size="18" letter-spacing="2">SOLO GAME DEV  ·  WEB BUILDER</text>
      <text x="72" y="374" fill="#64748b" font-size="13" letter-spacing="2">LOGIC × DESIGN, IN PRACTICE.</text>

      <text x="952" y="54" fill="#64748b" font-size="12" letter-spacing="2">TARGET LOCKED</text>
      <text x="926" y="384" fill="#a78bfa" font-size="12" letter-spacing="2">BUILD // PLAY // SHIP</text>
    </g>

    <g stroke="url(#accent)" stroke-width="3" fill="none">
      <path d="M34 78V34h44M1122 34h44v44M34 342v44h44M1122 386h44v-44"/>
    </g>
  </g>

  <rect x="8" y="8" width="1184" height="404" rx="22" fill="none" stroke="#312e81" stroke-width="2"/>
</svg>
